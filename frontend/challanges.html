<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PulsePoint - Challenges</title>
	<script src="/frontend/js/home-tailwind.js"></script>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="/frontend/css/common.css">
	<link rel="stylesheet" href="/frontend/css/home.css">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="pp-page-shell pp-page-shell-spread custom-scrollbar">
	<div class="ambient-glow-top"></div>
	<div class="ambient-glow-bottom"></div>

	<nav class="pp-navbar">
		<div class="pp-nav-wrapper">
			<div class="pp-logo-box">
				<div class="pp-logo-icon">
					<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z"></path>
					</svg>
				</div>
				<div class="flex flex-col">
					<span class="pp-logo-text">
						PULSE<span class="text-pulseGreen">POINT</span>
					</span>
					<span class="pp-logo-sub">Personal Performance Hub</span>
				</div>
			</div>

			<div class="pp-tab-container">
				<a href="/home?tab=workspace" id="tabBtn-workspace" class="pp-tab-btn pp-tab-btn--inactive">
					Workspace
				</a>
				<a href="/dashboard" id="tabBtn-dashboard" class="pp-tab-btn pp-tab-btn--inactive">
					Dashboard
				</a>
				<a href="/home?tab=workouts" id="tabBtn-workouts" class="pp-tab-btn pp-tab-btn--inactive">
					Workouts
				</a>
				<a href="/home?tab=habits" id="tabBtn-habits" class="pp-tab-btn pp-tab-btn--inactive">
					Habit Builder
				</a>
				<a href="/challanges" id="tabBtn-challenges" class="pp-tab-btn pp-tab-btn--active">
					Challenges
				</a>
			</div>

			<div class="pp-user-menu">
				<div class="pp-streak-badge">
					<span class="pp-streak-dot"></span>
					<span class="text-gray-400">Streak:</span>
					<span id="streakCounter" class="text-white font-bold font-mono">0 Days</span>
				</div>
				<div class="flex items-center gap-3">
					<div class="pp-profile-meta">
						<div id="userDisplayName" class="pp-profile-name">Loading...</div>
						<div class="pp-profile-status">Active User</div>
					</div>
					<button onclick="logout()" title="Logout" class="pp-logout-btn">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
						</svg>
					</button>
				</div>
			</div>
		</div>
	</nav>

	<script src="/frontend/js/app-common.js"></script>
	<script>
		const { API_BASE, session, storage } = window.PulseApp;
		const currentUserId = session.requireUser('/login');
		const currentUserName = storage.get(session.keys.userName, '');
		const currentUserEmail = storage.get(session.keys.userEmail, '');
		const currentUserStreak = Number(storage.get(session.keys.userStreak, 0) || 0);

		if (!currentUserId) {
			throw new Error('User session is required to load challenges page.');
		}

		async function loadActiveUserName() {
			const fallbackName = currentUserName || currentUserEmail || 'Unknown User';
			const userDisplayName = document.getElementById('userDisplayName');
			const streakCounter = document.getElementById('streakCounter');

			userDisplayName.textContent = fallbackName;
			streakCounter.textContent = `${currentUserStreak} ${currentUserStreak === 1 ? 'Day' : 'Days'}`;

			try {
				const response = await fetch(`${API_BASE}/auth/me/${currentUserId}`);
				if (!response.ok) {
					throw new Error(`Failed to fetch user details: ${response.status}`);
				}

				const user = await response.json();
				const displayName = user.name || user.email || fallbackName;
				const streakDays = Number(user.current_streak || 0);

				userDisplayName.textContent = displayName;
				streakCounter.textContent = `${streakDays} ${streakDays === 1 ? 'Day' : 'Days'}`;
				if (user.name) {
					storage.set(session.keys.userName, user.name);
				}
				if (user.email) {
					storage.set(session.keys.userEmail, user.email);
				}
				storage.set(session.keys.userStreak, streakDays);
			} catch (error) {
				console.error('Failed to load active user details:', error);
			}
		}

		function logout() {
			if (confirm('Are you sure you want to logout?')) {
				storage.removeMany([
					session.keys.userId,
					session.keys.userName,
					session.keys.userEmail,
					session.keys.userStreak,
				]);
				window.location.href = 'http://127.0.0.1:8000/login';
			}
		}

		loadActiveUserName();
	</script>
</body>
</html>
